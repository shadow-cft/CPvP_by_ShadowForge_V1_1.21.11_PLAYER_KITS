# This is a basic workflow to help you get started with Actions

name: Build Datapack

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Datapack ZIP
        run: |
          mkdir -p build
          zip -r "build/CPvP_by_ShadowForge_V1_1.21.11_PLAYER_KITS.zip" pack.mcmeta data

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CPvP_by_ShadowForge_V1_1.21.11_PLAYER_KITS
          path: build/*.zip
